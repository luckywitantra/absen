<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>AiMoy — Registrasi Wajah Admin</title><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><style>body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:20px;margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:800;font-size:12px;margin:12px 0 5px}select,button{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;font-size:16px}button{background:#1d4ed8;color:white;font-weight:800;cursor:pointer;margin-top:12px}button.secondary{background:#f1f5f9;color:#334155}video{width:100%;max-height:420px;object-fit:cover;border-radius:16px;background:#0f172a}.status{font-size:13px;color:#475569;margin-top:12px;min-height:20px}@media(max-width:600px){.row{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="wrap"><header class="card"><h1>Registrasi Wajah AiMoy</h1><p style="color:#64748b;font-size:13px">Akses admin saja. Buka dari halaman admin dalam tab yang sama agar sesi dapat digunakan.</p><button class="secondary" onclick="location.href='./admin.html'">← Kembali ke Admin</button></header><section class="card"><div class="row"><div><label for="staff">Karyawan</label><select id="staff"><option value="">Memuat master…</option></select></div><div><label for="outlet">Outlet</label><input id="outlet" readonly style="width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;box-sizing:border-box"></div></div><video id="video" autoplay muted playsinline></video><div class="row"><button id="start">Aktifkan kamera</button><button id="capture">Deteksi & simpan wajah</button></div><div id="status" class="status" role="status">Memeriksa sesi admin…</div></section></main><script>
const API_URL='https://script.google.com/macros/s/AKfycby1bFf9dO88Ouah2MGtnNjW6Tjx9jx2fXGNBzBVe6LyuBhrbDJiTYaqSJIZehvv_DrtFQ/exec';const KEY='aimoy_admin_session_v2';const token=sessionStorage.getItem(KEY);const $=id=>document.getElementById(id);let stream=null,staff=[];
async function api(action,payload={}){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,payload,adminToken:token})});return r.json();}
function status(t){$('status').textContent=t;}
async function init(){if(!token){status('Sesi admin tidak ditemukan. Kembali ke admin dan masuk terlebih dahulu.');$('start').disabled=true;$('capture').disabled=true;return;}try{const d=await api('init_admin');if(d.status!=='ready')throw Error(d.message||'Gagal memuat master');staff=d.dataKaryawan||[];$('staff').innerHTML='<option value="">Pilih karyawan…</option>'+staff.map((k,i)=>`<option value="${i}">${k.nama} — ${k.outlet}</option>`).join('');$('staff').onchange=()=>{$('outlet').value=staff[Number($('staff').value)]?.outlet||'';};status('Master siap. Pilih staf lalu aktifkan kamera.');}catch(e){status('Gagal: '+e.message);}}
$('start').onclick=async()=>{try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')]);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream;status('Kamera aktif. Pastikan hanya satu wajah terlihat, pencahayaan cukup, dan minta persetujuan karyawan.');}catch(e){status('Kamera/model gagal dimuat: '+e.message);}};
$('capture').onclick=async()=>{const i=Number($('staff').value);if(!Number.isInteger(i)||!staff[i]){status('Pilih karyawan.');return;}if(!$('video').srcObject){status('Aktifkan kamera terlebih dahulu.');return;}try{status('Menganalisis wajah…');const detection=await faceapi.detectSingleFace($('video'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks().withFaceDescriptor();if(!detection)throw Error('Wajah tidak terdeteksi. Atur posisi dan cahaya lalu coba kembali.');const k=staff[i];const d=await api('enroll',{employeeId:k.id,nama:k.nama,role:k.role,outlet:k.outlet,descriptor:Array.from(detection.descriptor)});if(d.status!=='success')throw Error(d.message||'Penyimpanan gagal');status(d.message||'Wajah berhasil disimpan.');}catch(e){status('Gagal: '+e.message);}};
window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());});init();
</script></body></html>
