<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7f1d1d"><title>AiMoy Portal Karyawan</title><link rel="manifest" href="manifest-employee.json"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1f2937;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:20px}.brand{background:linear-gradient(135deg,#450a0a,#991b1b);color:#fff;border-radius:24px;padding:22px;display:flex;align-items:center;gap:14px}.brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 4px 18px #0f172a08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}input,select,textarea,button{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font:inherit;font-size:16px}button{background:#991b1b;color:white;border:0;font-weight:800;cursor:pointer;margin-top:10px}button.secondary{background:#f3f4f6;color:#374151}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 10px}.muted{color:#6b7280;font-size:13px}.hidden{display:none!important}.pill{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:8px}.status{font-size:13px;margin-top:10px;min-height:18px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="wrap"><header class="brand"><img src="./logoaimoy.png" alt="Logo AiMoy"><div><h1>Portal Karyawan AiMoy</h1><p class="muted" style="color:#fef2f2;margin:6px 0 0">Jadwal, riwayat absensi, dan permohonan SDM</p></div></header>
<section id="login" class="card"><h2>Masuk ke portal karyawan</h2><p class="muted">Akun portal harus dibuat oleh admin. Portal ini terpisah dari layar absensi.</p><form id="login-form"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="login-btn">Masuk</button></form><div id="login-status" class="status" role="status"></div></section>
<section id="app" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><h2 id="hello">Profil</h2><p id="outlet" class="muted"></p></div><button class="secondary" style="width:auto;margin:0" id="logout">Keluar</button></div></div><div class="grid"><section class="card"><h2>Riwayat absensi</h2><div id="history" class="muted">Memuat…</div></section><section class="card"><h2>Jadwal saya</h2><div id="schedule" class="muted">Memuat…</div></section></div><section class="card"><h2>Ajukan permohonan</h2><form id="request-form"><label for="type">Jenis permohonan</label><select id="type"><option>Izin</option><option>Sakit</option><option>Koreksi Absensi</option><option>Tukar Shift</option></select><label for="date">Tanggal</label><input id="date" type="date" required><label for="detail">Detail (opsional)</label><input id="detail" maxlength="500" placeholder="Contoh: jam absensi yang perlu dikoreksi"><label for="reason">Alasan</label><textarea id="reason" rows="3" maxlength="1000" required></textarea><button id="request-btn">Kirim permohonan</button></form><div id="request-status" class="status" role="status"></div></section><section class="card"><h2>Permohonan saya</h2><div id="requests" class="muted">Memuat…</div></section></section>
</main><script>
const API_URL='https://script.google.com/macros/s/AKfycby1bFf9dO88Ouah2MGtnNjW6Tjx9jx2fXGNBzBVe6LyuBhrbDJiTYaqSJIZehvv_DrtFQ/exec';const TOKEN_KEY='aimoy_employee_session_v1';let employeeToken=sessionStorage.getItem(TOKEN_KEY)||'';let employeeProfile=null;
const $=id=>document.getElementById(id);function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(action,payload={},employee=true){const body={action,payload};if(employee&&employeeToken)body.employeeToken=employeeToken;const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)});return r.json();}
function showApp(on){$('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on);}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-status').textContent='Memverifikasi…';$('login-btn').disabled=true;try{const d=await api('employee_login',{username:$('username').value.trim(),password:$('password').value},false);if(d.status!=='success')throw Error(d.message||'Login gagal');employeeToken=d.token;sessionStorage.setItem(TOKEN_KEY,employeeToken);employeeProfile=d.employee;await loadPortal();}catch(err){$('login-status').textContent=err.message;}finally{$('login-btn').disabled=false;}});
async function loadPortal(){const d=await api('employee_self_service');if(d.status!=='success'){employeeToken='';sessionStorage.removeItem(TOKEN_KEY);showApp(false);$('login-status').textContent=d.message||'Sesi berakhir. Masuk kembali.';return;}employeeProfile=d.employee;showApp(true);$('hello').textContent='Halo, '+d.employee.nama;$('outlet').textContent=d.employee.outlet+' · '+d.employee.role;$('history').innerHTML=d.history.length?d.history.map(x=>`<div class="item"><strong>${esc(x.tanggal)} · ${esc(x.jam)}</strong><div>${esc(x.tipe)} <span class="pill">${esc(x.status)}</span></div><div class="muted">${esc(x.shift)} · ${esc(x.keterangan)}</div></div>`).join(''):'Belum ada riwayat absensi.';$('schedule').innerHTML=d.schedule.length?d.schedule.map(x=>`<div class="item"><strong>${esc(x.tanggal)}</strong><div>${esc(x.shift)} · <span class="pill">${esc(x.status)}</span></div></div>`).join(''):'Belum ada jadwal yang dibuat.';$('requests').innerHTML=d.requests.length?d.requests.map(x=>`<div class="item"><strong>${esc(x.jenis)} · ${esc(x.tanggal)}</strong><div><span class="pill">${esc(x.status)}</span></div><div class="muted">${esc(x.alasan)} ${esc(x.catatan||'')}</div></div>`).join(''):'Belum ada permohonan.';}
$('request-form').addEventListener('submit',async e=>{e.preventDefault();$('request-status').textContent='Mengirim permohonan…';$('request-btn').disabled=true;const requestId=sessionStorage.getItem('aimoy_pending_employee_request')||('req-'+Date.now()+'-'+Math.random().toString(36).slice(2));sessionStorage.setItem('aimoy_pending_employee_request',requestId);try{const d=await api('employee_submit_request',{requestId,jenis:$('type').value,tanggal:$('date').value,detail:$('detail').value,alasan:$('reason').value});if(d.status!=='success')throw Error(d.message||'Gagal');$('request-status').textContent=d.message;sessionStorage.removeItem('aimoy_pending_employee_request');$('reason').value='';$('detail').value='';await loadPortal();}catch(err){$('request-status').textContent=err.message;}finally{$('request-btn').disabled=false;}});
$('logout').onclick=()=>{employeeToken='';sessionStorage.removeItem(TOKEN_KEY);showApp(false);$('password').value='';};if(employeeToken)loadPortal().catch(()=>showApp(false));
</script></body></html>
